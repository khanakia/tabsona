version: '3'

# Every repeated command lives here, not in chat. `task --list` is the index.
#
# Chrome runs HEADLESS by default so repeated runs never steal focus.
# SPIKE_HEADLESS=0 to watch a run happen on screen.

vars:
  FIXTURE_PORT: '8787'
  # The origins the end-to-end suites pre-grant into the BUILT manifest. Named here
  # because they appear at every suite and the shipped manifest deliberately holds none —
  # a literal repeated per suite is how a dev origin finds its way back into the source.
  FIXTURE_ORIGIN: 'http://localhost:8787'
  FIXTURE_ORIGIN_2: 'http://localhost:8788'
  # The cookie-only fixture (COOKIE_ONLY=1), and the SAME server under a second host name,
  # so a suite can ask whether a persona's cookie reaches a host it does not belong to.
  COOKIE_ONLY_PORT: '8789'
  COOKIE_ONLY_ORIGIN: 'http://localhost:8789'
  COOKIE_ONLY_OTHER_ORIGIN: 'http://127.0.0.1:8789'
  # The SSO fixture: the app, and the SAME server reached as 127.0.0.1 acting as its
  # identity provider (a second cookie jar). Only the app is pre-granted, on purpose: the
  # suite's control is the leak through a provider the extension may not touch.
  SSO_PORT: '8790'
  SSO_ORIGIN: 'http://localhost:8790'
  SSO_IDP_ORIGIN: 'http://127.0.0.1:8790'
  # The relay hop between app and provider, holding no login (api.workos.com's role).
  SSO_RELAY_ORIGIN: 'http://relay.localhost:8790'
  EXT_DIST: apps/extension/dist

tasks:
  default:
    desc: List available tasks
    cmds: [task --list]

  install:
    desc: Install workspace dependencies
    cmds: [pnpm install]

  build:
    desc: Build the extension into apps/extension/dist (typecheck, popup, options, worker, content scripts, icons, manifest)
    cmds: [pnpm --filter extension build]

  dev:
    desc: Rebuild on change (reload the extension at chrome://extensions after each build)
    cmds: [pnpm --filter extension dev]

  test:
    desc: Unit + presenter + boundary tests
    cmds: [pnpm --filter extension test]

  typecheck:
    desc: Type-check the extension
    cmds: [pnpm --filter extension typecheck]

  # --- end-to-end, against the REAL built extension in a real Chrome --------

  e2e:isolation:
    desc: 'Two personas signed in at once, storage isolated per session, save -> wipe origin -> restore, badge honest (fixture)'
    deps: [build, fixture:up]
    env: {APP: fixture}
    cmds:
      - task: strays
      - task: grant
        vars: {ORIGINS: '{{.FIXTURE_ORIGIN}}'}
      - node spike/e2e-isolation.mjs

  e2e:persona:
    desc: 'Opening a PERSONA opens every one of its sites as a tab, each signed in as the right identity'
    deps: [build, fixture:up, fixture:up2]
    cmds:
      - task: strays
      - task: grant
        vars: {ORIGINS: '{{.FIXTURE_ORIGIN}} {{.FIXTURE_ORIGIN_2}}'}
      - node spike/e2e-persona.mjs

  e2e:capture:
    desc: "Save an ORDINARY tab's login into a persona, leave the browser's own jar untouched, and reopen it signed in"
    deps: [build, fixture:up]
    env: {APP: fixture}
    cmds:
      - task: strays
      - task: grant
        vars: {ORIGINS: '{{.FIXTURE_ORIGIN}}'}
      - node spike/e2e-capture.mjs

  e2e:tabs:
    desc: 'Open-in-this-tab moves every layer; a blank new tab never joins a persona; a link from a session tab does'
    deps: [build, fixture:up]
    cmds:
      - task: strays
      - task: grant
        vars: {ORIGINS: '{{.FIXTURE_ORIGIN}}'}
      - node spike/e2e-tabs.mjs

  e2e:flows:
    desc: 'The four ways to build a session: Add site · Use this tab · Move the login · Copy the login — and what each does to the plain tab'
    deps: [build, fixture:up]
    env: {APP: fixture}
    cmds:
      - task: strays
      - task: grant
        vars: {ORIGINS: '{{.FIXTURE_ORIGIN}}'}
      - node spike/e2e-flows.mjs

  e2e:move:
    desc: 'Saving a login MOVES it out of the shared browser jar, so signing out in a normal tab cannot kill the persona'
    deps: [build, fixture:up]
    env: {APP: fixture}
    cmds:
      - task: strays
      - task: grant
        vars: {ORIGINS: '{{.FIXTURE_ORIGIN}}'}
      - node spike/e2e-move.mjs

  e2e:twologins:
    desc: 'Two logins for ONE site: an existing second persona gets a fresh signed-out session, then both are signed in at once'
    deps: [build, fixture:up]
    env: {APP: fixture}
    cmds:
      - task: strays
      - task: grant
        vars: {ORIGINS: '{{.FIXTURE_ORIGIN}}'}
      - node spike/e2e-twologins.mjs

  e2e:cookieonly:
    desc: 'A cookie-only app that 302s signed-out users opens SIGNED IN from a persona, and its cookie reaches no other host'
    deps: [build, fixture:up-cookieonly]
    env:
      COOKIE_ONLY_ORIGIN: '{{.COOKIE_ONLY_ORIGIN}}'
      COOKIE_ONLY_OTHER_ORIGIN: '{{.COOKIE_ONLY_OTHER_ORIGIN}}'
    cmds:
      - task: strays
      - task: grant
        vars: {ORIGINS: '{{.COOKIE_ONLY_ORIGIN}} {{.COOKIE_ONLY_OTHER_ORIGIN}}'}
      - node spike/e2e-cookieonly.mjs

  e2e:signin:
    desc: 'Sign-in through another website: an un-allowed provider leaks and is reported; allowed, each persona signs in as itself; a forgotten login''s tab is released and re-adding opens signed out; with only "Allow on all sites" granted, no alert and no host named'
    deps: [build, fixture:up-sso]
    env:
      SSO_ORIGIN: '{{.SSO_ORIGIN}}'
      SSO_IDP_ORIGIN: '{{.SSO_IDP_ORIGIN}}'
      SSO_RELAY_ORIGIN: '{{.SSO_RELAY_ORIGIN}}'
    cmds:
      - task: strays
      - task: grant
        vars: {ORIGINS: '{{.SSO_ORIGIN}}'}
      - node spike/e2e-signin.mjs

  e2e:storage:
    desc: 'Storage lab: two personas on one origin stay apart on cookie, localStorage and IndexedDB logins, with a plain-tab control per layer'
    deps: [build, fixture:up]
    env: {LAB_ORIGIN: '{{.FIXTURE_ORIGIN}}'}
    cmds:
      - task: strays
      - task: grant
        vars: {ORIGINS: '{{.FIXTURE_ORIGIN}}'}
      - node spike/e2e-storage.mjs

  e2e:badge:
    desc: 'The in-page badge and title marker: default bottom-left, click shrinks it, drag moves it per site (survives reload), double-click resets, title carries the persona colour and follows a recolour, settings move/hide both, a plain tab gets neither'
    deps: [build, fixture:up]
    cmds:
      - task: strays
      - task: grant
        vars: {ORIGINS: '{{.FIXTURE_ORIGIN}}'}
      - node spike/e2e-badge.mjs

  e2e:migrate:
    desc: 'Upgrading from v1 data: the worker boots clean and every old session arrives as a persona with its logins intact'
    deps: [build]
    cmds:
      - task: strays
      - node spike/e2e-migrate.mjs

  e2e:boot:
    desc: 'Concurrent service-worker boots never produce "Duplicate script ID", and exactly one copy of each content script stays registered'
    deps: [build]
    cmds:
      - task: strays
      - task: grant
        vars: {ORIGINS: '{{.FIXTURE_ORIGIN}}'}
      - node spike/e2e-boot.mjs

  e2e:app:
    desc: 'Isolation + capture against a REAL app. Needs SYNC_USER1/SYNC_PASS1/SYNC_USER2/SYNC_PASS2 (APP_ORIGIN to target another app)'
    deps: [build]
    env: {APP: sync}
    vars:
      ORIGIN: '{{.APP_ORIGIN | default "https://sync.localhost"}}'
    cmds:
      - |
        : "${SYNC_USER1:?set SYNC_USER1/SYNC_PASS1/SYNC_USER2/SYNC_PASS2 in your shell or .env.local}"
      - task: strays
      - task: grant
        vars: {ORIGINS: '{{.ORIGIN}}'}
      - node spike/e2e-isolation.mjs
      - task: strays
      - node spike/e2e-capture.mjs
      - task: strays
      - node spike/e2e-twologins.mjs
      - task: strays
      - node spike/e2e-move.mjs

  check:
    desc: The real gate — typecheck, all tests, build, and every end-to-end proof on the fixture
    cmds:
      - task: secrets:scan
      - task: typecheck
      - task: test
      - task: test:scripts
      - task: preflight
      - task: e2e:isolation
      - task: e2e:persona
      - task: e2e:capture
      - task: e2e:tabs
      - task: e2e:boot
      - task: e2e:migrate
      - task: e2e:twologins
      - task: e2e:move
      - task: e2e:flows
      - task: e2e:cookieonly
      - task: e2e:signin
      - task: e2e:storage
      - task: e2e:badge

  # --- helpers --------------------------------------------------------------

  strays:
    desc: 'Kill any leftover spike Chrome instances, so a run never attaches to a stale build'
    internal: true
    cmds:
      - pkill -f 'spike-chrome-' 2>/dev/null || true
      - sleep 1

  grant:
    desc: 'Pre-grant origins in the BUILT manifest (test-only; the real grant needs a human click in Chrome)'
    internal: true
    cmds:
      - |
        # In normal use the popup's "allow this site" button calls
        # chrome.permissions.request, which opens Chrome's own confirmation dialog —
        # and that dialog requires a human click by design, so a headless run cannot
        # pass through it (an early attempt hung indefinitely). The SOURCE manifest is
        # never touched; dist is rebuilt from it every time anyway.
        node -e '
          const fs = require("node:fs");
          const p = "{{.EXT_DIST}}/manifest.json";
          const m = JSON.parse(fs.readFileSync(p, "utf8"));
          // The shipped manifest declares NO host permissions — every origin is granted at
          // runtime by the user. So the key is absent until this test-only step creates it.
          m.host_permissions ??= [];
          for (const origin of process.argv.slice(1)) {
            const want = origin.replace(/\/$/, "") + "/*";
            if (!m.host_permissions.includes(want)) m.host_permissions.push(want);
          }
          fs.writeFileSync(p, JSON.stringify(m, null, 2));
          console.log("[grant] " + m.host_permissions.join(" "));
        ' {{.ORIGINS}}

  test:scripts:
    desc: 'Tests for the build/packaging scripts (node:test — they live outside the extension bundle, so vitest does not see them)'
    cmds: [node --test apps/extension/scripts/*.test.mjs]

  preflight:
    desc: 'Check the BUILT extension against every Chrome Web Store hard requirement (fails the pack)'
    deps: [build]
    cmds: [node apps/extension/scripts/preflight-store.mjs]

  package:
    desc: 'Produce the zip to upload to the Chrome Web Store (build, preflight, then zip)'
    deps: [preflight]
    cmds:
      - mkdir -p dist
      - |
        # The Store requires manifest.json at the ARCHIVE ROOT, so the zip is made from
        # inside dist/ rather than from the repo root — a zip containing a `dist/` folder
        # is rejected on upload with a message that does not say why.
        # -X drops macOS resource forks, which otherwise appear as stray files in review.
        VERSION=$(node -p 'require("./apps/extension/manifest.json").version')
        OUT="$PWD/dist/tabsona-$VERSION.zip"
        rm -f "$OUT"
        cd {{.EXT_DIST}} && zip -rqX "$OUT" . -x '.*' -x '*/.*'
        cd - >/dev/null
        echo "→ dist/tabsona-$VERSION.zip  ($(du -h "$OUT" | cut -f1))"
        unzip -l "$OUT" | head -8

  # --- secrets ---------------------------------------------------------------
  # The repo is PUBLIC and .env holds live Store credentials. Config: .gitleaks.toml.

  hooks:install:
    desc: 'Activate the pre-commit secret + binary guard for this clone (installs gitleaks via brew if missing)'
    cmds:
      - git config --local core.hooksPath .githooks
      - echo "✓ git hooksPath = .githooks (pre-commit guard active)"
      - |
        if ! command -v gitleaks >/dev/null 2>&1; then
          if command -v brew >/dev/null 2>&1; then brew install gitleaks
          else echo "install gitleaks: https://github.com/gitleaks/gitleaks#installing"; exit 1; fi
        fi
        echo "✓ gitleaks $(gitleaks version)"

  secrets:scan:
    desc: 'Scan the FULL git history for secrets (part of task check)'
    cmds: [gitleaks git --redact --no-banner .]

  secrets:scan:staged:
    desc: 'Scan only the staged diff (what the pre-commit hook runs)'
    cmds: [gitleaks git --staged --redact --no-banner --verbose .]

  # --- Chrome Web Store ------------------------------------------------------
  # Credentials in .env (git-ignored); see apps/extension/scripts/cws.mjs for each key.

  cws:auth:
    desc: 'Authorise the Store API once (opens Google consent; needs a human click). Writes CWS_REFRESH_TOKEN'
    cmds: [node apps/extension/scripts/cws.mjs auth]

  cws:create:
    desc: 'Create the Store item as a private DRAFT from the current package. Run once; writes CWS_EXTENSION_ID'
    deps: [package]
    cmds: [node apps/extension/scripts/cws.mjs create]

  cws:upload:
    desc: 'Upload the current package to the existing draft (bump manifest.version first)'
    deps: [package]
    cmds: [node apps/extension/scripts/cws.mjs upload]

  cws:publish:
    desc: 'Submit the draft for review — makes it PUBLIC once approved. Ask before running'
    cmds: [node apps/extension/scripts/cws.mjs publish]

  cws:status:
    desc: 'Show the draft item upload state'
    cmds: [node apps/extension/scripts/cws.mjs status]

  brand:
    desc: Regenerate the icon set and Chrome Web Store artwork from one description of the mark
    cmds: [node apps/extension/scripts/make-brand.mjs]

  screenshots:
    desc: 'Capture every Store and README image (1280x800 + 640x400) from the REAL built extension'
    deps: [build, fixture:up]
    cmds:
      - task: strays
      - task: grant
        vars: {ORIGINS: '{{.FIXTURE_ORIGIN}}'}
      - node spike/make-screenshots.mjs

  probe:app:
    desc: 'Find which storage layer an app keeps its login in. APP_URL required; APP_USER/APP_PASS to probe a signed-in state; --inspect to only dump the form'
    cmds:
      - |
        : "${APP_URL:?set APP_URL=https://your.app}"
        node spike/probe-app.mjs {{.CLI_ARGS}}

  probe:load:
    desc: 'Re-check which extension-loading path Chrome supports (Chrome 154 silently ignores --load-extension)'
    cmds: [node spike/probe-load.mjs]

  fixture:
    desc: Run the two-role fixture app in the foreground
    cmds: [node spike/fixture/server.js]

  fixture:up:
    desc: Start the fixture in the background if it is not already listening
    internal: true
    cmds:
      - |
        if curl -sf "http://localhost:{{.FIXTURE_PORT}}/whoami" >/dev/null 2>&1; then
          echo "fixture already listening on {{.FIXTURE_PORT}}"
        else
          node spike/fixture/server.js > /tmp/tabsona-fixture.log 2>&1 &
          for i in $(seq 1 40); do
            curl -sf "http://localhost:{{.FIXTURE_PORT}}/whoami" >/dev/null 2>&1 && break
            sleep 0.25
          done
          echo "fixture started on {{.FIXTURE_PORT}}"
        fi

  fixture:up2:
    desc: Start a SECOND fixture on another port, so a persona can span two real sites
    internal: true
    cmds:
      - |
        if curl -sf "http://localhost:8788/whoami" >/dev/null 2>&1; then
          echo "second fixture already listening on 8788"
        else
          PORT=8788 node spike/fixture/server.js > /tmp/tabsona-fixture-2.log 2>&1 &
          for i in $(seq 1 40); do
            curl -sf "http://localhost:8788/whoami" >/dev/null 2>&1 && break
            sleep 0.25
          done
          echo "second fixture started on 8788"
        fi

  fixture:up-sso:
    desc: Start the fixture for the SSO suite (its /sso and /idp routes), refusing a stale one without them
    internal: true
    cmds:
      - |
        if curl -sf "http://localhost:{{.SSO_PORT}}/whoami" >/dev/null 2>&1; then
          # A server already on the port from an older checkout has no /idp routes, and the
          # suite would then fail for a reason that has nothing to do with the extension.
          if ! curl -sf "http://localhost:{{.SSO_PORT}}/idp/authorize" >/dev/null 2>&1 \
            || [ "$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:{{.SSO_PORT}}/relay/authorize")" != "302" ]; then
            echo "a fixture without the SSO routes (or the relay hop) is on {{.SSO_PORT}} — stop it and rerun" >&2
            exit 1
          fi
          echo "sso fixture already listening on {{.SSO_PORT}}"
        else
          PORT={{.SSO_PORT}} node spike/fixture/server.js > /tmp/tabsona-fixture-sso.log 2>&1 &
          for i in $(seq 1 40); do
            curl -sf "http://localhost:{{.SSO_PORT}}/whoami" >/dev/null 2>&1 && break
            sleep 0.25
          done
          echo "sso fixture started on {{.SSO_PORT}}"
        fi

  fixture:up-cookieonly:
    desc: Start the fixture in COOKIE_ONLY mode (login only in an HttpOnly cookie, 302 when signed out)
    internal: true
    cmds:
      - |
        if curl -sf "http://localhost:{{.COOKIE_ONLY_PORT}}/whoami" >/dev/null 2>&1; then
          echo "cookie-only fixture already listening on {{.COOKIE_ONLY_PORT}}"
        else
          COOKIE_ONLY=1 PORT={{.COOKIE_ONLY_PORT}} node spike/fixture/server.js > /tmp/tabsona-fixture-cookieonly.log 2>&1 &
          for i in $(seq 1 40); do
            curl -sf "http://localhost:{{.COOKIE_ONLY_PORT}}/whoami" >/dev/null 2>&1 && break
            sleep 0.25
          done
          echo "cookie-only fixture started on {{.COOKIE_ONLY_PORT}}"
        fi

  fixture:down:
    desc: Stop the background fixture
    cmds:
      - pkill -f 'spike/fixture/server.js' || echo "not running"
